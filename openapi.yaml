paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check endpoint
      description:
        Reports the health status of the application and its dependencies
        (Database, Redis).
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
