openapi: 3.0.3
info:
  title: ALUA Academy Management API
  version: 1.0.0
  description: API documentation for the ALUA Academy Management backend.
servers:
  - url: https://alua.localbox.online
    description: Local development server
tags:
  - name: Health
    description: System health and status endpoints
  - name: Auth
    description: Authentication endpoints
  - name: Profile
    description: User profile management and setup endpoints
  - name: Media
    description: Media and file upload management endpoints
  - name: Settings
    description: User settings and preferences endpoints

components:
  securitySchemes:
    adminAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: 'Cookie based access token for Admin API.'
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT Bearer token for authentication.

        Note: The `/auth/verify` and `/auth/resend` endpoints expect the
        OTP-page pending verification token,

        whereas `/auth/check` and `/auth/logout` expect the standard user access token.

        '
  schemas:
    CheckAccessResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - data
          properties:
            message:
              type: string
              example: 'User is authenticated.'
            data:
              $ref: '#/components/schemas/SessionDTO'
    FindRecoverUserByEmailPayload:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: user@example.com
    VerifyRecoverUserOtpPayload:
      type: object
      required:
        - otp
      properties:
        otp:
          type: string
          example: '123456'
          description: 6-digit numeric OTP
    ResetRecoverUserPasswordPayload:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          example: newStrongPassword123!
          description: Minimum 6 characters
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        traceId:
          type: string
          format: uuid
      required:
        - success
        - message
        - traceId
    TokenResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                token:
                  type: string
              required:
                - token
    MediaResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - data
          properties:
            message:
              type: string
              example: 'Media uploads successful'
            data:
              type: array
              items:
                type: string
                format: uri
                example: 'https://alua-bucket.s3.amazonaws.com/attachments/123e4567-e89b-12d3-a456-426614174000-1697280000000.jpg'
              description: Array of S3 URLs for uploaded files
    MulterErrorResponse:
      type: object
      required:
        - success
        - status
        - message
        - traceId
      properties:
        success:
          type: boolean
          example: false
        status:
          type: integer
          example: 400
        message:
          type: string
          example: "'files' attachments are required."
        traceId:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
    DeleteMediaPayload:
      type: object
      required:
        - urls
      properties:
        urls:
          type: array
          items:
            type: string
            format: uri
            example: 'https://alua-bucket.s3.amazonaws.com/attachments/123e4567-e89b-12d3-a456-426614174000-1697280000000.jpg'
          description: List of media S3 URLs to delete.
    DeleteMediaResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            message:
              type: string
              example: 'Media items delatation successful!'
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Server Is Running
        dependencies:
          type: object
          properties:
            database:
              type: string
              example: up
            redis:
              type: string
              example: up
        traceId:
          type: string
          format: uuid
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errorType:
          type: string
        traceId:
          type: string
          format: uuid
      required:
        - success
        - message
        - traceId
    SystemErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            errorType:
              type: string
              enum:
                - INVALID_JSON
                - SERVER_ERROR
    AuthErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            errorType:
              type: string
              enum:
                - TOKEN_EXPIRED
                - TOKEN_INVALID
                - TOKEN_BLACKLISTED
                - USER_SUSPENDED
                - ACCOUNT_INACTIVE
                - USER_ALREADY_EXISTS
                - INVALID_CREDENTIALS
                - DUPLICATE_DATA
                - OTP_EXPIRED
                - INVALID_OTP
                - ACCESS_DENIED
                - USER_NOT_FOUND
                - INVALID_DEVICE_CONTEXT
                - DEVICE_NOT_FOUND
                - DEVICE_NOT_OWNED
                - SESSION_LOGGED_OUT
                - SESSION_REVOKED
                - SESSION_EXPIRED
                - FORBIDDEN
    ValidationErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
    SignupPayload:
      type: object
      required:
        - fullName
        - email
        - phone
        - role
        - password
        - isLegalTermAccepted
      properties:
        fullName:
          type: string
          minLength: 1
          example: 'John Doe'
        email:
          type: string
          format: email
          example: 'john.doe@example.com'
        phone:
          type: string
          pattern: '^\+?[1-9]\d{1,14}$'
          example: '+1234567890'
        role:
          type: string
          enum:
            - PARENT
            - TEACHER
          example: PARENT
        password:
          type: string
          minLength: 6
          maxLength: 16
          description: Must contain at least one uppercase letter, one lowercase letter, one number, and one special character.
          example: 'Secret123!'
        isLegalTermAccepted:
          type: boolean
          example: true
    SignupDTO:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: Temporary OTP page verification token.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    SignupResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - data
          properties:
            message:
              type: string
              example: 'Signup successful,Please check you email for otp to verify your account!'
            data:
              $ref: '#/components/schemas/SignupDTO'
    SignupDuplicateErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required:
            - errorType
          properties:
            message:
              type: string
              example: 'User with this email already exist'
            errorType:
              type: string
              example: 'DUPLICATE_DATA'
    VerifySignupPayload:
      type: object
      required:
        - otp
        - deviceIdentifier
        - platform
      properties:
        otp:
          type: string
          minLength: 6
          example: '123456'
          description: 6-digit OTP code sent to user email.
        deviceIdentifier:
          type: string
          minLength: 1
          example: 'device-uuid-1234'
        fcmToken:
          type: string
          minLength: 1
          example: 'fcm_token_sample_abc123'
          description: 'Optional FCM push token for push notifications. Omit if the user has denied notification permission.'
        platform:
          type: string
          enum:
            - ANDROID
            - IOS
          example: 'ANDROID'
    VerifySignupUserDTO:
      type: object
      required:
        - accessToken
        - isProfileSetup
        - role
        - accountStatus
        - id
        - fullName
        - avatarUrl
      properties:
        accessToken:
          type: string
          description: Standard user access token for authenticated endpoints.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        isProfileSetup:
          type: boolean
          example: true
        role:
          type: string
          enum:
            - PARENT
            - TEACHER
          example: PARENT
        accountStatus:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - SUSPENDED
          example: ACTIVE
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        fullName:
          type: string
          example: 'John Doe'
        avatarUrl:
          type: string
          format: uri
          nullable: true
          example: null
    VerifySignupResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - data
          properties:
            message:
              type: string
              example: 'User verification successful'
            data:
              $ref: '#/components/schemas/VerifySignupUserDTO'
    ResendVerificationOtpResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            message:
              type: string
              example: 'Signup verification otp resend successful!'
    CheckAccessTokenPayload:
      type: object
      properties:
        fcmToken:
          type: string
          example: 'fcm-device-token-xyz123'
          description: 'Optional updated FCM device push token to rotate on the session.'
    LoginPayload:
      type: object
      required:
        - email
        - password
        - role
        - deviceIdentifier
        - platform
      properties:
        email:
          type: string
          format: email
          example: 'john.doe@example.com'
        password:
          type: string
          format: password
          minLength: 1
          example: 'Secret123!'
        role:
          type: string
          enum:
            - PARENT
            - TEACHER
          example: 'PARENT'
        deviceIdentifier:
          type: string
          minLength: 1
          example: 'device-uuid-1234'
          description: 'Unique client device identifier.'
        fcmToken:
          type: string
          minLength: 1
          example: 'fcm_token_sample_abc123'
          description: 'Optional FCM push token for push notifications.'
        platform:
          type: string
          enum:
            - ANDROID
            - IOS
          example: 'ANDROID'
        rememberMe:
          type: boolean
          default: false
          example: false
          description: 'Flag to determine session duration (30 days if true, 7 days if false).'
    LoginDTO:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          description: 'Standard user access token for authenticated endpoints.'
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        user:
          $ref: '#/components/schemas/SessionDTO'
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - data
          properties:
            message:
              type: string
              example: 'Login successful.'
            data:
              $ref: '#/components/schemas/LoginDTO'
    LogoutResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            message:
              type: string
              example: 'Logout successful.'
    ParentProfileSetupPayload:
      type: object
      properties:
        avatarUrl:
          type: string
          format: uri
          example: 'https://example.com/avatar.jpg'
        address:
          type: string
          example: '123 Main St, Springfield'
        occupation:
          type: string
          example: 'Software Engineer'
        relationWithChild:
          type: string
          example: 'Father'
    SessionDTO:
      type: object
      required:
        - userId
        - fullName
        - email
        - phone
        - avatarUrl
        - role
        - status
        - isProfileSetup
        - profileCompletedAt
        - language
      properties:
        userId:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174000'
        fullName:
          type: string
          example: 'John Doe'
        email:
          type: string
          format: email
          example: 'john.doe@example.com'
        phone:
          type: string
          example: '+1234567890'
        avatarUrl:
          type: string
          format: uri
          nullable: true
          example: 'https://example.com/avatar.jpg'
        role:
          type: string
          enum:
            - PARENT
            - TEACHER
            - ADMIN
          example: 'PARENT'
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - SUSPENDED
          example: 'ACTIVE'
        isProfileSetup:
          type: boolean
          example: true
        profileCompletedAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-14T09:50:00.000Z'
        language:
          $ref: '#/components/schemas/Language'
    ParentProfileSetupDTO:
      $ref: '#/components/schemas/SessionDTO'
    ParentProfileSetupResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - data
          properties:
            message:
              type: string
              example: 'Parent profile setup successful.'
            data:
              $ref: '#/components/schemas/ParentProfileSetupDTO'
    TeacherProfileSetupPayload:
      type: object
      properties:
        avatarUrl:
          type: string
          format: uri
          example: 'https://example.com/avatar.jpg'
        department:
          type: string
          example: 'Mathematics'
        designation:
          type: string
          example: 'Senior Lecturer'
        bio:
          type: string
          example: 'Experienced high school mathematics instructor.'
    TeacherProfileSetupDTO:
      $ref: '#/components/schemas/SessionDTO'

    TeacherProfileSetupResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - data
          properties:
            message:
              type: string
              example: 'Teacher profile setup successful.'
            data:
              $ref: '#/components/schemas/TeacherProfileSetupDTO'

    UpdateParentProfilePayload:
      type: object
      properties:
        fullName:
          type: string
          example: 'Eleanor Rivera'
        avatarUrl:
          type: string
          format: uri
          example: 'https://example.com/avatar.jpg'
        phone:
          type: string
          example: '+15551234'
        occupation:
          type: string
          example: 'Architect'
        address:
          type: string
          example: '742 Evergreen Terrace'
        relationWithChild:
          type: string
          example: 'Mother'

    UpdateTeacherProfilePayload:
      type: object
      properties:
        fullName:
          type: string
          example: 'Dr. Sarah Jenkins'
        avatarUrl:
          type: string
          format: uri
          example: 'https://example.com/avatar.jpg'
        phone:
          type: string
          example: '+15552045'
        department:
          type: string
          example: 'Mathematics'
        designation:
          type: string
          example: 'Head of Mathematics & STEM Faculty'
        bio:
          type: string
          example: 'Over 15 years of teaching experience.'

    ParentProfileDTO:
      type: object
      required:
        - userId
        - fullName
        - email
        - phone
        - avatarUrl
        - language
        - createdAt
        - occupation
        - address
        - relationWithChild
      properties:
        userId:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174000'
        fullName:
          type: string
          example: 'Eleanor Rivera'
        email:
          type: string
          format: email
          example: 'eleanor@example.com'
        phone:
          type: string
          example: '+15551234'
        avatarUrl:
          type: string
          format: uri
          nullable: true
          example: 'https://example.com/avatar.jpg'
        language:
          type: string
          enum:
            - EN
            - ES
          example: 'EN'
        createdAt:
          type: string
          format: date-time
          example: '2026-10-13T10:00:00.000Z'
        occupation:
          type: string
          nullable: true
          example: 'Architect'
        address:
          type: string
          nullable: true
          example: '742 Evergreen Terrace'
        relationWithChild:
          type: string
          nullable: true
          example: 'Mother'

    TeacherProfileDTO:
      type: object
      required:
        - userId
        - fullName
        - email
        - phone
        - avatarUrl
        - language
        - createdAt
        - department
        - designation
        - bio
      properties:
        userId:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174000'
        fullName:
          type: string
          example: 'Dr. Sarah Jenkins'
        email:
          type: string
          format: email
          example: 'sarah.jenkins@aula360.edu'
        phone:
          type: string
          example: '+15552045'
        avatarUrl:
          type: string
          format: uri
          nullable: true
          example: 'https://example.com/avatar.jpg'
        language:
          type: string
          enum:
            - EN
            - ES
          example: 'EN'
        createdAt:
          type: string
          format: date-time
          example: '2026-10-13T10:00:00.000Z'
        department:
          type: string
          nullable: true
          example: 'Mathematics'
        designation:
          type: string
          nullable: true
          example: 'Head of Mathematics & STEM Faculty'
        bio:
          type: string
          nullable: true
          example: 'Over 15 years of teaching experience.'

    ParentProfileResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - data
          properties:
            message:
              type: string
              example: 'Parent profile fetched successfully.'
            data:
              $ref: '#/components/schemas/ParentProfileDTO'

    ParentProfileUpdateResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - data
          properties:
            message:
              type: string
              example: 'Parent profile updated successfully.'
            data:
              $ref: '#/components/schemas/ParentProfileDTO'

    TeacherProfileResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - data
          properties:
            message:
              type: string
              example: 'Teacher profile fetched successfully.'
            data:
              $ref: '#/components/schemas/TeacherProfileDTO'

    TeacherProfileUpdateResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - data
          properties:
            message:
              type: string
              example: 'Teacher profile updated successfully.'
            data:
              $ref: '#/components/schemas/TeacherProfileDTO'
    ChangePasswordPayload:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          example: 'OldPassw0rd!'
          description: User's current password
        newPassword:
          type: string
          minLength: 6
          maxLength: 16
          example: 'NewPassw0rd@2026'
          description: New password (6-16 characters, at least 1 uppercase letter, 1 lowercase letter, 1 number, and 1 special character)
    ChangePasswordResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            message:
              type: string
              example: 'Change password successful.'
    Language:
      type: string
      enum:
        - EN
        - ES
      example: 'EN'
    NotificationSettingsDTO:
      type: object
      required:
        - push
        - email
      properties:
        push:
          type: boolean
          example: true
        email:
          type: boolean
          example: true
    SettingsDTO:
      type: object
      required:
        - language
        - notifications
      properties:
        language:
          $ref: '#/components/schemas/Language'
        notifications:
          $ref: '#/components/schemas/NotificationSettingsDTO'
    UpdateLanguagePayload:
      type: object
      required:
        - language
      properties:
        language:
          $ref: '#/components/schemas/Language'
    UpdateNotificationPayload:
      type: object
      required:
        - push
        - email
      properties:
        push:
          type: boolean
          example: true
        email:
          type: boolean
          example: true
    SettingsResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - data
          properties:
            message:
              type: string
              example: 'Settings fetched successfully.'
            data:
              $ref: '#/components/schemas/SettingsDTO'
    UpdateLanguageResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - data
          properties:
            message:
              type: string
              example: 'Language updated successfully.'
            data:
              $ref: '#/components/schemas/SettingsDTO'
    UpdateNotificationResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - data
          properties:
            message:
              type: string
              example: 'Notification preferences updated successfully.'
            data:
              $ref: '#/components/schemas/SettingsDTO'

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check endpoint
      description:
        Reports the health status of the application and its dependencies
        (Database, Redis).
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/signup:
    post:
      tags:
        - Auth
      summary: Register a new user
      description: Registers a new PARENT or TEACHER user account, hashes password, saves record, generates an OTP, sets OTP in Redis, sends verification email, and returns an OTP page token.
      operationId: authSignup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupPayload'
      responses:
        '201':
          description: Signup successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
              example:
                success: true
                message: 'Signup successful,Please check you email for otp to verify your account!'
                data:
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '400':
          description: Invalid JSON payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemErrorResponse'
              example:
                success: false
                message: 'Invalid JSON Payload'
                errorType: 'INVALID_JSON'
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '409':
          description: User with this email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupDuplicateErrorResponse'
              example:
                success: false
                message: 'User with this email already exist'
                errorType: 'DUPLICATE_DATA'
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '422':
          description: Request body validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                success: false
                message: 'Request body validation failed'
                errors:
                  - field: email
                    message: 'Please provide a valid email address'
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemErrorResponse'
              example:
                success: false
                message: 'Internal server error'
                errorType: 'SERVER_ERROR'
                traceId: 123e4567-e89b-12d3-a456-426614174000
  /api/v1/auth/verify:
    post:
      tags:
        - Auth
      summary: Verify signup user account with OTP
      description: Verifies user account using OTP and the temporary OTP page token in the Authorization Bearer header. Marks user ACTIVE, saves device session, invalidates OTP, blacklists the OTP token, and returns user access token and profile info.
      operationId: authVerifySignup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
