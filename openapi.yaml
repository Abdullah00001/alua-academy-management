openapi: 3.0.3
info:
  title: ALUA Academy Management API
  version: 1.0.0
  description: API documentation for the ALUA Academy Management backend.
servers:
  - url: https://alua.localbox.online
    description: Local development server
tags:
  - name: Health
    description: System health and status endpoints
  - name: Auth
    description: Authentication endpoints
  - name: Profile
    description: User profile management and setup endpoints

components:
  securitySchemes:
    adminAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: 'Cookie based access token for Admin API.'
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT Bearer token for authentication.

        Note: The `/auth/verify` and `/auth/resend` endpoints expect the
        OTP-page pending verification token,

        whereas `/auth/check` expects the standard user access token.

        '
  schemas:
    CheckAccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: User is authenticated
        traceId:
          type: string
          format: uuid
        data:
          type: object
          properties:
            name:
              type: string
              example: John Doe
            avatar:
              type: string
              nullable: true
              example: https://example.com/avatar.jpg
            role:
              type: string
              example: USER
            accountStatus:
              type: string
              example: ACTIVE
      required:
        - success
        - message
        - traceId
    FindRecoverUserByEmailPayload:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: user@example.com
    VerifyRecoverUserOtpPayload:
      type: object
      required:
        - otp
      properties:
        otp:
          type: string
          example: '123456'
          description: 6-digit numeric OTP
    ResetRecoverUserPasswordPayload:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          example: newStrongPassword123!
          description: Minimum 6 characters
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        traceId:
          type: string
          format: uuid
      required:
        - success
        - message
        - traceId
    TokenResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                token:
                  type: string
              required:
                - token
    MediaResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                type: string
                format: uri
              description: Array of S3 URLs for uploaded files
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Server Is Running
        dependencies:
          type: object
          properties:
            database:
              type: string
              example: up
            redis:
              type: string
              example: up
        traceId:
          type: string
          format: uuid
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errorType:
          type: string
        traceId:
          type: string
          format: uuid
      required:
        - success
        - message
        - traceId
    SystemErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            errorType:
              type: string
              enum:
                - INVALID_JSON
                - SERVER_ERROR
    AuthErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            errorType:
              type: string
              enum:
                - TOKEN_EXPIRED
                - TOKEN_INVALID
                - TOKEN_BLACKLISTED
                - USER_BLOCKED
                - USER_SUSPENDED
                - ACCOUNT_INACTIVE
                - USER_ALREADY_EXISTS
                - INVALID_CREDENTIALS
                - DUPLICATE_DATA
                - OTP_EXPIRED
                - INVALID_OTP
                - ACCESS_DENIED
                - USER_NOT_FOUND
                - INVALID_DEVICE_CONTEXT
                - DEVICE_NOT_FOUND
                - DEVICE_NOT_OWNED
                - SESSION_LOGGED_OUT
                - SESSION_REVOKED
                - SESSION_EXPIRED
    ValidationErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
    SignupPayload:
      type: object
      required:
        - fullName
        - email
        - phone
        - role
        - password
        - isLegalTermAccepted
      properties:
        fullName:
          type: string
          minLength: 1
          example: 'John Doe'
        email:
          type: string
          format: email
          example: 'john.doe@example.com'
        phone:
          type: string
          pattern: '^\+?[1-9]\d{1,14}$'
          example: '+1234567890'
        role:
          type: string
          enum:
            - PARENT
            - TEACHER
          example: PARENT
        password:
          type: string
          minLength: 6
          maxLength: 16
          description: Must contain at least one uppercase letter, one lowercase letter, one number, and one special character.
          example: 'Secret123!'
        isLegalTermAccepted:
          type: boolean
          example: true
    SignupDTO:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: Temporary OTP page verification token.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    SignupResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - data
          properties:
            message:
              type: string
              example: 'Signup successful,Please check you email for otp to verify your account!'
            data:
              $ref: '#/components/schemas/SignupDTO'
    SignupDuplicateErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required:
            - errorType
          properties:
            message:
              type: string
              example: 'User with this email already exist'
            errorType:
              type: string
              example: 'DUPLICATE_DATA'
    VerifySignupPayload:
      type: object
      required:
        - otp
        - deviceIdentifier
        - fcmToken
        - platform
      properties:
        otp:
          type: string
          minLength: 6
          example: '123456'
          description: 6-digit OTP code sent to user email.
        deviceIdentifier:
          type: string
          minLength: 1
          example: 'device-uuid-1234'
        fcmToken:
          type: string
          minLength: 1
          example: 'fcm_token_sample_abc123'
        platform:
          type: string
          enum:
            - ANDROID
            - IOS
          example: 'ANDROID'
    VerifySignupUserDTO:
      type: object
      required:
        - accessToken
        - isProfileSetup
        - role
        - accountStatus
        - id
        - fullName
        - avatarUrl
      properties:
        accessToken:
          type: string
          description: Standard user access token for authenticated endpoints.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        isProfileSetup:
          type: boolean
          example: true
        role:
          type: string
          enum:
            - PARENT
            - TEACHER
          example: PARENT
        accountStatus:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - BLOCKED
          example: ACTIVE
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        fullName:
          type: string
          example: 'John Doe'
        avatarUrl:
          type: string
          format: uri
          nullable: true
          example: null
    VerifySignupResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - data
          properties:
            message:
              type: string
              example: 'User verification successful'
            data:
              $ref: '#/components/schemas/VerifySignupUserDTO'
    ResendVerificationOtpResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            message:
              type: string
              example: 'Signup verification otp resend successful!'
    ParentProfileSetupPayload:
      type: object
      properties:
        avatarUrl:
          type: string
          format: uri
          example: 'https://example.com/avatar.jpg'
        address:
          type: string
          example: '123 Main St, Springfield'
        occupation:
          type: string
          example: 'Software Engineer'
        relationWithChild:
          type: string
          example: 'Father'
    ParentProfileSetupDTO:
      type: object
      required:
        - userId
        - fullName
        - avatarUrl
        - role
        - status
        - isProfileSetup
        - profileCompletedAt
      properties:
        userId:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174000'
        fullName:
          type: string
          example: 'John Doe'
        avatarUrl:
          type: string
          format: uri
          nullable: true
          example: 'https://example.com/avatar.jpg'
        role:
          type: string
          enum:
            - PARENT
            - TEACHER
            - ADMIN
          example: 'PARENT'
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - SUSPENDED
          example: 'ACTIVE'
        isProfileSetup:
          type: boolean
          example: true
        profileCompletedAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-14T09:50:00.000Z'
    ParentProfileSetupResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - data
          properties:
            message:
              type: string
              example: 'Parent profile setup successful.'
            data:
              $ref: '#/components/schemas/ParentProfileSetupDTO'
    TeacherProfileSetupPayload:
      type: object
      properties:
        avatarUrl:
          type: string
          format: uri
          example: 'https://example.com/avatar.jpg'
        department:
          type: string
          example: 'Mathematics'
        designation:
          type: string
          example: 'Senior Lecturer'
        bio:
          type: string
          example: 'Experienced high school mathematics instructor.'
    TeacherProfileSetupDTO:
      type: object
      required:
        - userId
        - fullName
        - avatarUrl
        - role
        - status
        - isProfileSetup
        - profileCompletedAt
      properties:
        userId:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174000'
        fullName:
          type: string
          example: 'Jane Smith'
        avatarUrl:
          type: string
          format: uri
          nullable: true
          example: 'https://example.com/avatar.jpg'
        role:
          type: string
          enum:
            - PARENT
            - TEACHER
            - ADMIN
          example: 'TEACHER'
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - SUSPENDED
          example: 'ACTIVE'
        isProfileSetup:
          type: boolean
          example: true
        profileCompletedAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-14T10:20:00.000Z'
    TeacherProfileSetupResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - data
          properties:
            message:
              type: string
              example: 'Teacher profile setup successful.'
            data:
              $ref: '#/components/schemas/TeacherProfileSetupDTO'


paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check endpoint
      description:
        Reports the health status of the application and its dependencies
        (Database, Redis).
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/signup:
    post:
      tags:
        - Auth
      summary: Register a new user
      description: Registers a new PARENT or TEACHER user account, hashes password, saves record, generates an OTP, sets OTP in Redis, sends verification email, and returns an OTP page token.
      operationId: authSignup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupPayload'
      responses:
        '201':
          description: Signup successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
              example:
                success: true
                message: 'Signup successful,Please check you email for otp to verify your account!'
                data:
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '400':
          description: Invalid JSON payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemErrorResponse'
              example:
                success: false
                message: 'Invalid JSON Payload'
                errorType: 'INVALID_JSON'
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '409':
          description: User with this email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupDuplicateErrorResponse'
              example:
                success: false
                message: 'User with this email already exist'
                errorType: 'DUPLICATE_DATA'
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '422':
          description: Request body validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                success: false
                message: 'Request body validation failed'
                errors:
                  - field: email
                    message: 'Please provide a valid email address'
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemErrorResponse'
              example:
                success: false
                message: 'Internal server error'
                errorType: 'SERVER_ERROR'
                traceId: 123e4567-e89b-12d3-a456-426614174000
  /api/v1/auth/verify:
    post:
      tags:
        - Auth
      summary: Verify signup user account with OTP
      description: Verifies user account using OTP and the temporary OTP page token in the Authorization Bearer header. Marks user ACTIVE, saves device session, invalidates OTP, blacklists the OTP token, and returns user access token and profile info.
      operationId: authVerifySignup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifySignupPayload'
      responses:
        '200':
          description: User verification successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifySignupResponse'
              example:
                success: true
                message: 'User verification successful'
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  isProfileSetup: true
                  role: PARENT
                  accountStatus: ACTIVE
                  id: 123e4567-e89b-12d3-a456-426614174000
                  fullName: 'John Doe'
                  avatarUrl: null
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '400':
          description: Invalid JSON payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemErrorResponse'
              example:
                success: false
                message: 'Invalid JSON Payload'
                errorType: 'INVALID_JSON'
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '401':
          description: Authentication or OTP verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              examples:
                tokenExpired:
                  summary: Token expired
                  value:
                    success: false
                    message: 'Token has been expired'
                    errorType: 'TOKEN_EXPIRED'
                    traceId: 123e4567-e89b-12d3-a456-426614174000
                tokenInvalid:
                  summary: Token invalid
                  value:
                    success: false
                    message: 'Token is invalid'
                    errorType: 'TOKEN_INVALID'
                    traceId: 123e4567-e89b-12d3-a456-426614174000
                tokenBlacklisted:
                  summary: Token revoked
                  value:
                    success: false
                    message: 'Token has been revoked'
                    errorType: 'TOKEN_BLACKLISTED'
                    traceId: 123e4567-e89b-12d3-a456-426614174000
                otpExpired:
                  summary: OTP expired
                  value:
                    success: false
                    message: 'OTP has expired, please request a new one'
                    errorType: 'OTP_EXPIRED'
                    traceId: 123e4567-e89b-12d3-a456-426614174000
                otpInvalid:
                  summary: OTP invalid
                  value:
                    success: false
                    message: 'Invalid OTP, please check and try again'
                    errorType: 'INVALID_OTP'
                    traceId: 123e4567-e89b-12d3-a456-426614174000
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: 'User not found'
                errorType: 'USER_NOT_FOUND'
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '422':
          description: Request body validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                success: false
                message: 'Request body validation failed'
                errors:
                  - field: otp
                    message: 'Otp must be at least 6 characters long'
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemErrorResponse'
              example:
                success: false
                message: 'Internal server error'
                errorType: 'SERVER_ERROR'
                traceId: 123e4567-e89b-12d3-a456-426614174000
  /api/v1/auth/resend:
    post:
      tags:
        - Auth
      summary: Resend verification OTP
      description: Generates and sends a new verification OTP to the user email, invalidating the previous OTP code. Expects the temporary OTP page token in the Authorization Bearer header.
      operationId: authResendVerificationOtp
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Verification OTP resent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendVerificationOtpResponse'
              example:
                success: true
                message: 'Signup verification otp resend successful!'
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              examples:
                tokenExpired:
                  summary: Token expired
                  value:
                    success: false
                    message: 'Token has been expired'
                    errorType: 'TOKEN_EXPIRED'
                    traceId: 123e4567-e89b-12d3-a456-426614174000
                tokenInvalid:
                  summary: Token invalid
                  value:
                    success: false
                    message: 'Token is invalid'
                    errorType: 'TOKEN_INVALID'
                    traceId: 123e4567-e89b-12d3-a456-426614174000
                tokenBlacklisted:
                  summary: Token revoked
                  value:
                    success: false
                    message: 'Token has been revoked'
                    errorType: 'TOKEN_BLACKLISTED'
                    traceId: 123e4567-e89b-12d3-a456-426614174000
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: 'User not found'
                errorType: 'USER_NOT_FOUND'
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemErrorResponse'
              example:
                success: false
                message: 'Internal server error'
                errorType: 'SERVER_ERROR'
                traceId: 123e4567-e89b-12d3-a456-426614174000
  /api/v1/profile/setup/parent:
    post:
      tags:
        - Profile
      summary: Setup parent profile
      description: Sets up parent-specific profile details (address, occupation, relationWithChild) and updates user avatarUrl, marking isProfileSetup as true and recording profileCompletedAt.
      operationId: profileSetupParent
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParentProfileSetupPayload'
      responses:
        '200':
          description: Parent profile setup successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentProfileSetupResponse'
              example:
                success: true
                message: 'Parent profile setup successful.'
                data:
                  userId: '123e4567-e89b-12d3-a456-426614174000'
                  fullName: 'John Doe'
                  avatarUrl: 'https://example.com/avatar.jpg'
                  role: 'PARENT'
                  status: 'ACTIVE'
                  isProfileSetup: true
                  profileCompletedAt: '2026-10-14T09:50:00.000Z'
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '400':
          description: Invalid JSON payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemErrorResponse'
              example:
                success: false
                message: 'Invalid JSON Payload'
                errorType: 'INVALID_JSON'
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '401':
          description: Authentication or device session error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              examples:
                tokenMissing:
                  summary: Token not found
                  value:
                    success: false
                    message: 'Token not found'
                    errorType: 'TOKEN_INVALID'
                    traceId: 123e4567-e89b-12d3-a456-426614174000
                tokenInvalid:
                  summary: Token is invalid
                  value:
                    success: false
                    message: 'Token is invalid'
                    errorType: 'TOKEN_INVALID'
                    traceId: 123e4567-e89b-12d3-a456-426614174000
                tokenExpired:
                  summary: Token expired
                  value:
                    success: false
                    message: 'Token has been expired'
                    errorType: 'TOKEN_EXPIRED'
                    traceId: 123e4567-e89b-12d3-a456-426614174000
                tokenRevoked:
                  summary: Token revoked
                  value:
                    success: false
                    message: 'Token has been revoked'
                    errorType: 'TOKEN_BLACKLISTED'
                    traceId: 123e4567-e89b-12d3-a456-426614174000
                missingDevice:
                  summary: Missing device context
                  value:
                    success: false
                    message: 'Session is missing device information.'
                    errorType: 'INVALID_DEVICE_CONTEXT'
                    traceId: 123e4567-e89b-12d3-a456-426614174000
                deviceNotFound:
                  summary: Device not found
                  value:
                    success: false
                    message: 'Session is no longer valid. Please log in again.'
                    errorType: 'DEVICE_NOT_FOUND'
                    traceId: 123e4567-e89b-12d3-a456-426614174000
                deviceNotOwned:
                  summary: Device not owned
                  value:
                    success: false
                    message: 'Session is no longer valid. Please log in again.'
                    errorType: 'DEVICE_NOT_OWNED'
                    traceId: 123e4567-e89b-12d3-a456-426614174000
                sessionLoggedOut:
                  summary: Session logged out
                  value:
                    success: false
                    message: 'You have been logged out. Please log in again.'
                    errorType: 'SESSION_LOGGED_OUT'
                    traceId: 123e4567-e89b-12d3-a456-426614174000
                sessionRevoked:
                  summary: Session revoked
                  value:
                    success: false
                    message: 'Your session has ended. Please log in again.'
                    errorType: 'SESSION_REVOKED'
                    traceId: 123e4567-e89b-12d3-a456-426614174000
                sessionExpired:
                  summary: Session expired
                  value:
                    success: false
                    message: 'Your session has expired. Please log in again.'
                    errorType: 'SESSION_EXPIRED'
                    traceId: 123e4567-e89b-12d3-a456-426614174000
        '403':
          description: Account status error
